<div class="login-page-wrapper" style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3f4f6; position: fixed; top: 0; left: 0; z-index: 9999;">
  
  <div class="login-card-box" style="display: flex; width: 850px; max-width: 95%; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden;">
    
    <!-- Partie Gauche : Illustration / Gradient Pro -->
    <div style="flex: 1; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; padding: 40px; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <span style="background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold;">PFE Manager</span>
      </div>
      <div>
        <h1 style="font-size: 26px; font-weight: bold; margin-bottom: 12px; color: white;">Gestion des PFE</h1>
        <p style="font-size: 14px; opacity: 0.8; margin: 0; line-height: 1.5;">Plateforme unifiée pour les étudiants, les entreprises et l'administration.</p>
      </div>
      <div style="font-size: 12px; opacity: 0.5;">
        ENSI - École Nationale des Sciences de l’Informatique
      </div>
    </div>

    <!-- Partie Droite : Formulaire -->
    <div style="flex: 1.2; padding: 40px; display: flex; flex-direction: column; justify-content: center;">
      <h2 style="font-size: 22px; font-weight: bold; color: #111827; margin-bottom: 8px;">Connexion</h2>
      <p style="font-size: 13px; color: #6b7280; margin-bottom: 24px;">Entrez vos identifiants pour continuer.</p>

      <form [formGroup]="loginForm" style="width: 100%;">
        
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px;">Adresse Email</label>
          <mat-form-field appearance="outline" style="width: 100%;">
            <input matInput type="email" placeholder="nom@exemple.com" formControlName="username" required />
          </mat-form-field>
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px;">Mot de passe</label>
          <mat-form-field appearance="outline" style="width: 100%;">
            <input matInput type="password" placeholder="••••••••" formControlName="password" required />
          </mat-form-field>
        </div>

        <div style="margin-bottom: 24px;">
          <mat-checkbox formControlName="rememberMe">Se souvenir de moi</mat-checkbox>
        </div>

        <button
          type="button"
          (click)="login()"
          [disabled]="loginForm.invalid || isSubmitting"
          style="width: 100%; height: 46px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s;"
          onmouseover="this.style.background='#4338ca'"
          onmouseout="this.style.background='#4f46e5'"
        >
          Se connecter
        </button>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280;">
          Pas encore de compte ? 
          <a routerLink="/auth/signup" style="color: #4f46e5; font-weight: bold; text-decoration: none;">S'inscrire</a>
        </div>

      </form>
    </div>

  </div>

</div>
