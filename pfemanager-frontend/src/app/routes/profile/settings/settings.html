<div class="panel-box">
  
  <!-- En-tête avec l'icône 'edit' bien visible -->
  <div class="panel-header">
    <div class="panel-title-group">
      <div class="header-icon-box">
        <mat-icon>edit</mat-icon>
      </div>
      <div>
        <h3 class="panel-title">Modifier mes Informations</h3>
        <p class="panel-subtitle">Mettez à jour vos coordonnées personnelles et votre mot de passe</p>
      </div>
    </div>
  </div>

  <div class="panel-body">
    <form [formGroup]="userForm" (ngSubmit)="sauvegarder()" class="settings-form">
      
      <div class="form-grid">
        <!-- Prénom -->
        <div class="form-group">
          <label class="form-label">Prénom <span class="required-star">*</span></label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="prenom" placeholder="Votre prénom" required />
          </mat-form-field>
        </div>

        <!-- Nom -->
        <div class="form-group">
          <label class="form-label">Nom <span class="required-star">*</span></label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="nom" placeholder="Votre nom" required />
          </mat-form-field>
        </div>

        <!-- Email (Lecture seule / Sécurisé) -->
        <div class="form-group">
          <label class="form-label">Adresse Email (Non modifiable)</label>
          <mat-form-field appearance="outline" class="w-full disabled-field">
            <input matInput formControlName="email" readonly />
            <mat-icon matSuffix class="lock-icon">lock</mat-icon>
          </mat-form-field>
        </div>

        <!-- Téléphone -->
        <div class="form-group">
          <label class="form-label">Numéro de Téléphone <span class="required-star">*</span></label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="tel" placeholder="20123456" required />
            <mat-icon matSuffix class="suffix-icon">phone</mat-icon>
          </mat-form-field>
        </div>

        <!-- Nouveau Mot de Passe -->
        <div class="form-group full-col">
          <label class="form-label">Nouveau Mot de Passe (laisser vide pour conserver l'actuel)</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput type="password" formControlName="nouveauMotDePasse" placeholder="••••••••••••" />
            <mat-icon matSuffix class="suffix-icon">key</mat-icon>
          </mat-form-field>
        </div>
      </div>

      <!-- Pied de formulaire avec bouton dégagé de l'engrenage -->
      <div class="form-footer">
        <span class="required-hint">* Champs obligatoires</span>
        
        <button class="btn-save-primary" type="submit" [disabled]="userForm.invalid">
          <mat-icon>save</mat-icon>
          <span>Enregistrer les modifications</span>
        </button>
      </div>

    </form>
  </div>

</div>
